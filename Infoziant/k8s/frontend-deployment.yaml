apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: vehiclevault
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehiclevault
      component: frontend
  template:
    metadata:
      labels:
        app: vehiclevault
        component: frontend
    spec:
      containers:
      - name: frontend
        image: venkatarupesh123/vehiclevault-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
