apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: vehiclevault
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehiclevault
      component: backend
  template:
    metadata:
      labels:
        app: vehiclevault
        component: backend
    spec:
      containers:
      - name: backend
        image: venkatarupesh123/vehiclevault-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/vehiclevault"
          # To use MongoDB Atlas, replace above with:
          # value: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/vehiclevault?retryWrites=true&w=majority"
        - name: UPLOAD_DIR
          value: "/app/uploads"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
